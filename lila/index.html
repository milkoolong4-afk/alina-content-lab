<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F2FB">
<title>Lila</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lila">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
/* ============ ТЕМЫ ============ */
:root, [data-theme="light"] {
  --page: #EDE4F5;
  --bg: #F7F2FB;
  --ink: #2B2340;
  --ink2: rgba(43,35,64,.64);
  --ink3: rgba(43,35,64,.38);
  --line: rgba(43,35,64,.08);
  --accent: #7356E0;
  --accent2: #9B84F0;
  --accent-soft: rgba(115,86,224,.12);
  --on-accent: #fff;
  --glass: rgba(255,255,255,.52);
  --glass-strong: rgba(255,255,255,.78);
  --stroke: rgba(255,255,255,.85);
  --shadow: 0 12px 34px rgba(91,63,140,.12), 0 2px 6px rgba(91,63,140,.05);
  --blob1: #F7B3D2; --blob2: #C8B4F6; --blob3: #B3D7F6;
  --o1: #F6A6CC; --o2: #B095F4; --o3: #98CBF5; --o4: #F1E6FD;
  --orb-glow: rgba(176,149,244,.5);
  --gloss: .95;
  --danger: #D2557A;
  --cat-kedice: #EC8FAE; --cat-embroidery: #C68CE2; --cat-travel: #6EB3EA;
  --cat-content: #F2A469; --cat-lila: #8F7BEF; --cat-personal: #77C7A2; --cat-ideas: #E7C35E;
}
[data-theme="dark"] {
  --page: #0E110C;
  --bg: #161B13;
  --ink: #ECE5D1;
  --ink2: rgba(236,229,209,.66);
  --ink3: rgba(236,229,209,.4);
  --line: rgba(236,229,209,.09);
  --accent: #B3BF78;
  --accent2: #8E9E58;
  --accent-soft: rgba(179,191,120,.14);
  --on-accent: #1A1F14;
  --glass: rgba(46,52,36,.46);
  --glass-strong: rgba(56,62,44,.78);
  --stroke: rgba(236,229,209,.1);
  --shadow: 0 14px 36px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.2);
  --blob1: #5B4A2C; --blob2: #3F5530; --blob3: #2B4438;
  --o1: #C9A464; --o2: #7F904A; --o3: #5D7E6C; --o4: #3B4130;
  --orb-glow: rgba(170,160,90,.32);
  --gloss: .55;
  --danger: #D98A6E;
  --cat-kedice: #CF8C74; --cat-embroidery: #B79AC4; --cat-travel: #7EA9B8;
  --cat-content: #D4A45E; --cat-lila: #A7B86C; --cat-personal: #8DB389; --cat-ideas: #CDBB82;
}

/* ============ БАЗА ============ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.45;
  background: var(--page); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  transition: background-color .5s;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
.serif { font-family: "Cormorant Garamond", Georgia, serif; }
svg { display: block; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 18px; height: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ============ УСТРОЙСТВО ============ */
.device {
  --top: calc(env(safe-area-inset-top) + 14px);
  --bottom: env(safe-area-inset-bottom);
  position: relative; width: 100vw; height: 100dvh; overflow: hidden; overflow: clip;
  background: var(--bg); color: var(--ink);
  transition: background-color .5s, color .5s;
  isolation: isolate;
}
.statusbar { display: none; }
@media (min-width: 600px) and (min-height: 560px) {
  body {
    background:
      radial-gradient(60vmax 60vmax at 15% 20%, color-mix(in srgb, var(--blob1) 45%, transparent), transparent 60%),
      radial-gradient(60vmax 60vmax at 85% 80%, color-mix(in srgb, var(--blob3) 45%, transparent), transparent 60%),
      var(--page);
  }
  .device {
    --top: 58px; --bottom: 8px;
    width: 390px; height: 844px; border-radius: 54px; flex: none;
    box-shadow: 0 0 0 11px #15111c, 0 0 0 12px #3a3346, 0 50px 100px rgba(30,20,50,.35);
    transform-origin: center center;
  }
  .statusbar {
    display: flex; position: absolute; z-index: 100; top: 0; left: 0; right: 0; height: 50px;
    align-items: center; justify-content: space-between; padding: 6px 30px 0 40px;
    font-weight: 600; font-size: 15px; pointer-events: none;
    background: linear-gradient(var(--bg) 55%, transparent); transition: background .5s;
  }
  .statusbar .island { position: absolute; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #0b0910; }
  .statusbar .sys { display: flex; gap: 6px; align-items: center; }
}

/* фоновые пятна */
.bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .75; transition: background-color .6s; }
.bg i:nth-child(1) { width: 320px; height: 320px; background: var(--blob1); top: -90px; left: -110px; animation: drift1 22s ease-in-out infinite alternate; }
.bg i:nth-child(2) { width: 300px; height: 300px; background: var(--blob2); top: 300px; right: -140px; animation: drift2 26s ease-in-out infinite alternate; }
.bg i:nth-child(3) { width: 280px; height: 280px; background: var(--blob3); bottom: -100px; left: -60px; animation: drift3 24s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(70px, 60px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-60px, -80px) scale(.9); } }
@keyframes drift3 { to { transform: translate(90px, -40px) scale(1.1); } }

/* ============ ЭКРАН ============ */
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: var(--top) 20px calc(120px + var(--bottom));
  scrollbar-width: none; overscroll-behavior: contain;
}
.screen::-webkit-scrollbar { display: none; }
.screen.enter > * { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
.screen.enter > *:nth-child(2) { animation-delay: .05s; }
.screen.enter > *:nth-child(3) { animation-delay: .1s; }
.screen.enter > *:nth-child(4) { animation-delay: .15s; }
.screen.enter > *:nth-child(5) { animation-delay: .2s; }
.screen.enter > *:nth-child(6) { animation-delay: .25s; }
.screen.enter > *:nth-child(7) { animation-delay: .3s; }
.screen.enter > *:nth-child(n+8) { animation-delay: .35s; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; margin-bottom: 14px; }
.topbar .right { display: flex; gap: 8px; }
.brand { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 26px; font-weight: 500; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 12%, transparent 30%), radial-gradient(circle at 70% 70%, var(--o3), transparent 60%), radial-gradient(circle at 25% 70%, var(--o1), transparent 60%), var(--o2); box-shadow: 0 2px 10px var(--orb-glow); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow);
}
.card { border-radius: 26px; padding: 18px; margin-bottom: 14px; position: relative; transition: background-color .5s, border-color .5s; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  transition: transform .15s;
}
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.press { transition: transform .15s ease, opacity .15s; }
.press:active, .icon-btn:active, .btn:active, .chip-btn:active, .task:active, .navbtn:active { transform: scale(.95); }

h1.title { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 44px; line-height: 1; margin: 6px 0 6px; letter-spacing: -.01em; }
.sub { color: var(--ink2); font-size: 14px; margin: 0 0 18px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 600; margin: 0 0 10px; }
.section-title { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 500; margin: 26px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title small { font-family: Inter, sans-serif; font-size: 13px; color: var(--ink3); font-weight: 500; }

.btn { min-height: 46px; border-radius: 999px; padding: 0 18px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; transition: transform .15s, background-color .3s, opacity .2s; }
.btn.primary { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: var(--on-accent); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.ghost { background: var(--glass-strong); border: 1px solid var(--stroke); }
.btn.danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-row .btn { flex: 1; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--accent-soft); color: var(--ink); }
.chip.cat { background: color-mix(in srgb, var(--c) 22%, transparent); }
.chip.cat i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* ============ СЕГОДНЯ ============ */
.date { color: var(--ink2); font-size: 14px; margin: 4px 0 0; }
.hello { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 46px; line-height: 1.02; margin: 8px 0 10px; letter-spacing: -.01em; }
.hello .a { color: var(--accent); }
.lead { color: var(--ink2); margin: 0 0 22px; max-width: 300px; }

.brief-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.brief-head h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 28px; margin: 0; line-height: 1; }
.brief-item { display: flex; gap: 12px; padding: 10px 10px; margin: 0 -10px; border-radius: 16px; transition: background-color .35s; }
.brief-item .n { font-family: "Cormorant Garamond", serif; font-size: 22px; color: var(--ink3); width: 14px; line-height: 1.1; }
.brief-item p { margin: 4px 0 0; font-size: 14px; color: var(--ink2); }
.brief-item.on { background: var(--accent-soft); }
.brief-item.on .n { color: var(--accent); }
.player { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.player .btn { padding: 0 18px 0 14px; }
.track { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.track b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 4px; transition: width .25s linear; }
.ptime { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.mini-orb { --s: 34px; }

.task { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 48px; padding: 8px 0; border-bottom: 1px solid var(--line); transition: transform .15s; }
.task:last-child { border-bottom: 0; }
.task .box { width: 24px; height: 24px; border-radius: 50%; border: 1.6px solid var(--ink3); display: grid; place-items: center; flex: none; transition: background-color .25s, border-color .25s; }
.task .box svg { width: 14px; height: 14px; stroke: var(--on-accent); stroke-width: 2.4; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s .05s; }
.task.done .box { background: var(--accent); border-color: var(--accent); }
.task.done .box svg { stroke-dashoffset: 0; }
.task .t { flex: 1; font-size: 15px; transition: color .3s; position: relative; }
.task.done .t { color: var(--ink3); text-decoration: line-through; text-decoration-color: var(--ink3); }
.task .meta { font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.task.pop .box { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.counter { font-size: 13px; color: var(--ink3); font-weight: 500; }

.promise { background: linear-gradient(150deg, color-mix(in srgb, var(--blob1) 45%, var(--glass)), var(--glass) 60%); }
.promise q { display: block; font-family: "Cormorant Garamond", serif; font-size: 27px; line-height: 1.12; margin: 2px 0 8px; quotes: "«" "»"; }
.promise p { color: var(--ink2); margin: 0; font-size: 14px; }
.promise.leaving { animation: leave .4s forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(40px) scale(.96); } }

.linkrow { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 60px; padding: 0 18px; border-radius: 22px; font-weight: 500; }
.linkrow span { display: flex; align-items: center; gap: 10px; }

/* ============ МЫСЛИ ============ */
.search { display: flex; align-items: center; gap: 10px; height: 50px; border-radius: 999px; padding: 0 6px 0 16px; margin-bottom: 12px; }
.search input { flex: 1; border: 0; background: none; outline: none; height: 100%; font-size: 15px; min-width: 0; }
.search input::placeholder { color: var(--ink3); }
.search .icon-btn { width: 40px; height: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 16px; padding: 2px 20px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; background: var(--glass); border: 1px solid var(--stroke); transition: transform .15s, background-color .25s, color .25s; }
.chip-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.note { margin: 0; padding: 14px; border-radius: 24px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .15s; min-height: 150px; outline-offset: 3px; }
.note:active { transform: scale(.97); }
.note.wide { grid-column: 1 / -1; min-height: 0; }
.note h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.25; }
.note .time { font-size: 11px; color: var(--ink3); }
.note .ntop { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink2); font-size: 13px; margin: 0; }
.note.idea { background: linear-gradient(155deg, color-mix(in srgb, var(--c) 32%, var(--glass-strong)) 0%, var(--glass) 75%); }
.note.idea .lbl { display: flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); font-weight: 600; }
.note.reflection q { font-family: "Cormorant Garamond", serif; font-size: 21px; line-height: 1.12; quotes: "«" "»"; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.note.numbers .big { font-family: "Cormorant Garamond", serif; font-size: 38px; line-height: 1; font-weight: 500; color: var(--accent); }
.note.numbers ul { list-style: none; margin: 0; padding: 0; font-size: 12px; color: var(--ink2); }
.note.numbers li { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; border-top: 1px dashed var(--line); }
.note.fresh { animation: fresh 2.2s ease; }
@keyframes fresh { 0%, 40% { box-shadow: 0 0 0 3px var(--accent), var(--shadow); } 100% { box-shadow: var(--shadow); } }

.vpill { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--stroke); }
.vpill .play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); flex: none; transition: transform .15s; }
.vpill .play:active { transform: scale(.92); }
.wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; overflow: hidden; }
.wave i { flex: 1; max-width: 3px; min-width: 2px; border-radius: 2px; background: var(--ink3); transition: background-color .2s; }
.wave i.on { background: var(--accent); }
.vpill .dur { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 34px 10px; color: var(--ink2); }
.empty .serif { font-size: 26px; color: var(--ink); margin-bottom: 6px; }

/* ============ ПЛАН ============ */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 18px; }
.day { min-height: 66px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--ink2); background: var(--glass); border: 1px solid var(--stroke); transition: transform .15s, background-color .25s, color .25s; position: relative; }
.day b { font-size: 18px; font-weight: 500; color: var(--ink); font-family: "Cormorant Garamond", serif; font-size: 22px; line-height: 1; }
.day.today b { color: var(--accent); }
.day.on { background: var(--ink); color: color-mix(in srgb, var(--bg) 75%, transparent); border-color: var(--ink); }
.day.on b { color: var(--bg); }
.day .dots { display: flex; gap: 2px; height: 4px; }
.day .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.day.on .dots i { background: var(--bg); }
.day:active { transform: scale(.94); }

.goal { padding: 0; overflow: hidden; }
.goal-head { width: 100%; text-align: left; padding: 16px 18px; display: block; }
.goal-head .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.goal-head h3 { margin: 0; font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 500; line-height: 1.1; }
.goal-head .chev { transition: transform .3s; color: var(--ink3); }
.goal.open .chev { transform: rotate(90deg); }
.bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin: 12px 0 6px; }
.bar b { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, var(--accent2)), var(--c)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.goal-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink3); }
.goal-meta b { color: var(--ink); font-weight: 600; }
.goal-steps { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease; }
.goal.open .goal-steps { grid-template-rows: 1fr; }
.goal-steps > div { overflow: hidden; padding: 0 18px; }
.goal.open .goal-steps > div { padding-bottom: 8px; }

.idea-row { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 22px; margin-bottom: 10px; }
.idea-row .txt { flex: 1; }
.idea-row .txt b { display: block; font-weight: 500; font-size: 14px; line-height: 1.3; }
.idea-row .txt small { color: var(--ink3); font-size: 12px; }
.idea-row .btn { min-height: 40px; padding: 0 14px; font-size: 13px; flex: none; }
.idea-row .btn.added { background: var(--accent-soft); color: var(--accent); box-shadow: none; }

/* ============ РАЗГОВОР ============ */
.talk { display: flex; flex-direction: column; align-items: center; min-height: 100%; padding-bottom: 6px; }
.talk .topbar { width: 100%; }
.call-pill { font-variant-numeric: tabular-nums; }
.call-pill .live { width: 8px; height: 8px; border-radius: 50%; background: #5DC98A; box-shadow: 0 0 0 4px rgba(93,201,138,.2); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); font-weight: 500; letter-spacing: .02em; height: 30px; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.orb-btn { border-radius: 50%; margin: 8px 0 4px; position: relative; }
.orb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 10px; }
.talk-said { min-height: 22px; font-size: 13px; color: var(--ink3); text-align: center; max-width: 300px; margin-top: 8px; }
.talk-reply { font-family: "Cormorant Garamond", serif; font-size: 27px; line-height: 1.16; text-align: center; min-height: 128px; max-width: 330px; margin: 6px 0 10px; }

/* ================= СОСТОЯНИЕ (IndexedDB, запасной вариант — localStorage) ================= */
const KEY = 'lila-demo-v1';
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('IndexedDB недоступна'));
    const r = indexedDB.open('lila', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('audio'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }).catch(e => { dbp = null; throw e; }));
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return {
    get: (s, k) => tx(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => tx(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k)),
    clear: s => tx(s, 'readwrite', o => o.clear()),
    count: s => tx(s, 'readonly', o => o.count()),
  };
})();
let st;
async function load() {
  let data = null;
  try { data = await DB.get('kv', 'state'); ui.storage = 'idb'; } catch (e) { ui.storage = 'local'; }
  if (!data) { try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { data = null; } }
  st = data && data.v === 1 && Array.isArray(data.notes) ? data : seed();
  // сдвигаем демо-неделю на текущую, чтобы план не устаревал
  const mon = mondayOf(new Date()), cur = iso(mon);
  if (st.weekStart !== cur) {
    const diff = Math.round((mon - new Date(st.weekStart + 'T00:00:00')) / DAY);
    st.tasks.forEach(t => { const d = new Date(t.date + 'T00:00:00'); d.setDate(d.getDate() + diff); t.date = iso(d); });
    st.weekStart = cur;
  }
  save();
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* приватный режим */ } }
function save() {
  if (ui.storage === 'idb') DB.put('kv', 'state', st).catch(() => { ui.storage = 'local'; saveLocal(); });
  else saveLocal();
}

let ruVoice = null;
function pickVoice() { try { ruVoice = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)) || null; } catch (e) { ruVoice = null; } }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!st.voice || !ruVoice) return;

const isToday = ts => iso(new Date(ts)) === todayIso();
function when(ts) {
  const d = new Date(ts), hm = `${d.getHours()}:${pad(d.getMinutes())}`;
  if (isToday(ts)) return `Сегодня, ${hm}`;
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (iso(d) === iso(y)) return `Вчера, ${hm}`;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');
}
function waveBars(id, n = 34) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  let out = '';
  for (let i = 0; i < n; i++) { h = (h * 1103515245 + 12345) >>> 0; const v = 25 + (h % 75); out += `<i style="height:${Math.round(v * (0.55 + 0.45 * Math.sin(i / n * Math.PI)))}%"></i>`; }
  return out;
}
function noteCard(n) {
  const fresh = ui.fresh === n.id ? ' fresh' : '';

  const top = `<div class="ntop">${catChip(n.cat)}<span class="time">${when(n.created)}</span></div>`;
  if (n.type === 'voice') return `<article ${base}>${top}<h3>${esc(n.title)}</h3>
    ${n.pending ? `<span class="chip pending" data-pstatus="${n.id}">${ui.pendingStatus || 'Ждёт разбора'}</span>` : ''}
    <div class="vpill"><button class="play" data-act="play-note" data-id="${n.id}" aria-label="Прослушать">${I.play}</button><div class="wave" data-wave="${n.id}">${waveBars(n.id)}</div><span class="dur" data-dur="${n.id}">${fmt(n.dur)}</span></div>
    <p class="clamp">${n.pending ? 'Голос сохранён, текст появится после разбора.' : esc(n.text)}</p></article>`;
  if (n.type === 'idea') return `<article ${base}>${top}<span class="lbl">${I.spark}Идея</span><h3>${esc(n.title)}</h3><p class="clamp">${esc(n.text)}</p></article>`;
  if (n.type === 'reflection') return `<article ${base}>${top}<q>${esc(n.text)}</q></article>`;
  return `<article ${base}>${top}<h3>${esc(n.title)}</h3><div class="big">${esc(n.big)}</div><ul>${n.lines.map(l => `<li><span>${esc(l[0])}</span><b>${esc(l[1])}</b></li>`).join('')}</ul></article>`;
}
function filteredNotes() {

function talkEnter() {
  talk.state = 'listening'; talk.muted = false; talk.sec = 0;
  clearInterval(talk.clock);
  talk.clock = setInterval(() => { talk.sec++; const el = $('#callTime'); if (el) el.textContent = fmt(talk.sec); }, 1000);
}
function talkClear() { talk.timers.forEach(clearTimeout); talk.timers = []; hush(); }
function talkLeave() { talkClear(); clearInterval(talk.clock); }
function setTalk(state) {
  talk.state = state;
  const o = $('.talk .orb'); if (!o) return;
  o.className = 'orb ' + (talk.muted ? 'muted' : state);
  const label = talk.muted ? 'Микрофон выключен' : { listening: 'Слушаю', thinking: 'Думаю', speaking: 'Говорю' }[state];

}
function revealWords(el, text, speed, done) {
  el.innerHTML = '';
  const words = text.split(' ');
  words.forEach((w, i) => talk.timers.push(setTimeout(() => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w; el.appendChild(s);
    if (i === words.length - 1 && done) talk.timers.push(setTimeout(done, 900));
  }, i * speed)));
}
function aiSay(text) {
  setTalk('speaking');
  st.chat.push({ role: 'ai', text, t: Date.now() }); save(); refreshHistory();
  speak(text);
  revealWords($('#talkReply'), text, RM ? 40 : 170, () => { if (talk.state === 'speaking') setTalk('listening'); });
}
function userSaid(text, typed) {
  st.chat.push({ role: 'me', text, t: Date.now() }); save(); refreshHistory();
  $('#talkSaid').textContent = (typed ? 'Ты написала: ' : 'Ты: ') + '«' + text + '»';
}
function orbTap() {
  if (talk.muted) { toggleMic(); return; }
  talkClear();
  if (talk.state === 'listening') {
    const s = SCRIPT[talk.step % SCRIPT.length];
    userSaid(s.me, false);
    setTalk('thinking');
    $('#talkReply').innerHTML = '<span style="color:var(--ink3)">…</span>';
  } else if (talk.state === 'thinking') {
    const s = SCRIPT[talk.step % SCRIPT.length]; talk.step++;
    aiSay(s.ai);
  } else {
    // перебиваем: дописываем реплику сразу и слушаем
    const last = [...st.chat].reverse().find(m => m.role === 'ai');
    if (last) $('#talkReply').textContent = last.text;
    setTalk('listening');
  }
}

  $('#briefOrb').style.visibility = brief.playing ? 'visible' : 'hidden';
}
function toggleBrief() {

const vn = { id: null, t: 0, timer: null, audio: null, url: null, dur: 0 };
function stopVoiceNote() {
  clearInterval(vn.timer);
  if (vn.audio) { try { vn.audio.pause(); } catch (e) { } vn.audio = null; }
  if (vn.url) { URL.revokeObjectURL(vn.url); vn.url = null; }

    $$(`.play[data-id="${vn.id}"]`).forEach(b => { b.innerHTML = I.play; b.setAttribute('aria-label', 'Прослушать'); });

  }

}
function paintWave(id, p, left) {
  $$(`[data-wave="${id}"]`).forEach(w => { const bars = w.children; for (let i = 0; i < bars.length; i++) bars[i].classList.toggle('on', i / bars.length < p); });
  $$(`[data-dur="${id}"]`).forEach(d => d.textContent = fmt(Math.max(0, left)));
}
async function playNote(id) {
  if (vn.id === id) { stopVoiceNote(); hush(); return; }
  stopVoiceNote(); hush();
  let blob = null, dur = 0, text = '';
  if (id === 'rec') { blob = rec && rec.blob; dur = rec ? rec.sec : 0; }
  else {
    const n = st.notes.find(x => x.id === id); if (!n) return;
    dur = n.dur; text = n.text;
    if (n.audio) { try { blob = await DB.get('audio', id); } catch (e) { } if (!blob) { toast('Аудио этой записи не найдено'); return; } }
  }
  vn.id = id; vn.dur = dur; vn.t = 0;
  $$(`.play[data-id="${id}"]`).forEach(b => { b.innerHTML = I.pause; b.setAttribute('aria-label', 'Пауза'); });
  if (blob) {
    vn.url = URL.createObjectURL(blob);
    const a = new Audio(vn.url); vn.audio = a;
    a.onended = () => { if (vn.audio === a) stopVoiceNote(); };
    vn.timer = setInterval(() => { const total = isFinite(a.duration) && a.duration > 0 ? a.duration : Math.max(dur, 1); paintWave(id, a.currentTime / total, total - a.currentTime); }, 150);
    a.play().catch(() => { if (vn.audio === a) { stopVoiceNote(); toast('Не получилось воспроизвести запись'); } });
    return;
  }
  // у демо-заметок нет аудио — показываем воспроизведение и читаем текст голосом браузера
  speak(text);
  const step = .25;
  vn.timer = setInterval(() => { vn.t += step; paintWave(id, vn.t / dur, dur - vn.t); if (vn.t >= dur) stopVoiceNote(); }, step * 1000);
}

/* ================= РАЗБОР ТЕКСТА: категория, тип, задачи ================= */
const KW = {
  kedice: ['kedice', 'кедис', 'турец', 'урок', 'каппадок', 'стамбул', 'карточк', 'app store', 'эпп стор', 'приложени'],
  embroidery: ['вышив', 'магазин', 'нитк', 'мулине', 'пяльц', 'канв', 'набор', 'стеж', 'схем'],
  travel: ['билет', 'поездк', 'путешеств', 'сидне', 'мендос', 'сантьяго', 'таиланд', 'патагон', 'итали', 'япони', 'отел', 'перелет', 'виз', 'лететь', 'полет', 'маршрут'],
  content: ['рилс', 'reels', 'видео', 'монтаж', 'эпизод', 'блог', 'контент', 'сторис', 'сценари', 'ролик', 'тикток', 'подписчик'],
  lila: ['lila', 'лила', 'лилу', 'джарвис', 'ассистент', 'прототип', 'промпт'],
  personal: ['тренировк', 'спорт', 'звон', 'позвон', 'созвон', 'спать', 'выспат', 'здоров', 'мама', 'папа', 'устал', 'отдых', 'вечер'],
};
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
function scoreCat(text) {
  const t = ' ' + norm(text);
  let best = 'ideas', bestN = 0;
  for (const [cat, kws] of Object.entries(KW)) {
    const n = kws.filter(k => new RegExp('[^а-яa-z]' + k).test(t)).length;
    if (n > bestN) { bestN = n; best = cat; }
  }
  return { cat: best, sure: bestN > 0 };
}
const FILLER = /^(?:бы|мне|нам|наконец|обязательно|еще|ещё|уже|срочно|сегодня|завтра|вот|тоже|просто|точно)\s+/i;
function extractTasks(text) {
  const out = [], seen = new Set();
  for (const s of text.split(/[.!?;\n]+/)) {
    const re = /(?:^|[^а-яё])(не забыть|надо|нужно|сделать|сделай)\s+/gi;
    let m;
    while ((m = re.exec(s))) {
      const kw = m[1].toLowerCase();
      const rest = s.slice(m.index + m[0].length).split(/,|\s(?:а|но|потому что|чтобы|если|пока)\s/)[0];
      rest.split(/\s+и\s+(?=[а-яё]+(?:ть|ться|чь)(?:\s|$))/i).forEach((p, i) => {
        let x = p.trim();
        while (FILLER.test(x)) x = x.replace(FILLER, '');
        if (kw.startsWith('сдела') && i === 0) x = 'сделать ' + x;
        const w = x.split(/\s+/).filter(Boolean);
        if (!w.length || (w.length === 1 && !/(ть|ться|чь)$/i.test(w[0]))) return;
        x = w.slice(0, 9).join(' ');
        const k = norm(x).replace(/^сделать /, '');
        if (seen.has(k)) return;
        seen.add(k); out.push(cap(x));
      });
    }
  }
  return out.slice(0, 4);
}
function makeTitle(text) {
  const t = text.trim().replace(/^(?:так|слушай|ну|короче|в общем|итак|вот|смотри)[,\s]+/i, '');
  const w = t.split(/[.!?]/)[0].split(/\s+/).filter(Boolean);
  return cap(w.slice(0, 6).join(' ').replace(/[,:;—-]+$/, '')) + (w.length > 6 ? '…' : '');
}
function labelOf(text, tasks) {
  const t = norm(text);
  if (/решил|решено|правило|больше не |теперь только/.test(t)) return 'Решение';
  if (tasks.length) return 'Задача';
  if (/мечт/.test(t)) return 'Мечта';
  if (/иде[яюие]|а что если|можно было бы|придумал/.test(t)) return 'Идея';
  return 'Мысль';
}
function analyze(text) {
  const tasks = extractTasks(text), c = scoreCat(text);
  return { cat: c.cat, sure: c.sure, tasks, label: labelOf(text, tasks), title: makeTitle(text) };
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function micProblem(e) {
  if (location.protocol === 'file:') return 'Браузер не даёт микрофон странице, открытой из файла. Открой Lila по ссылке https:// или через локальный сервер.';
  if (!window.isSecureContext) return 'Микрофон работает только по защищённой ссылке https://.';
  if (!navigator.mediaDevices || !window.MediaRecorder) return 'Этот браузер не умеет записывать звук. Попробуй Safari или Chrome.';
  if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return 'Доступ к микрофону запрещён. Разреши его в настройках браузера и попробуй снова.';
  if (e && e.name === 'NotFoundError') return 'Микрофон не найден. Подключи его и попробуй снова.';
  return 'Не получилось включить микрофон' + (e && e.message ? `: ${e.message}` : '.');
}
const newRec = extra => Object.assign({ phase: 'init', sec: 0, timers: [], final: '', interim: '', cat: 'ideas', label: 'Мысль', title: '', tasks: [], tagList: [], text: '' }, extra);
function showRecOverlay() { const o = $('#rec'); o.classList.remove('closing'); o.classList.add('open'); }
async function openRecord() {
  stopBrief(); stopVoiceNote(); if (ui.screen === 'talk') talkClear(); hush();
  closeSheet();
  const r = rec = newRec({ real: true });
  showRecOverlay(); renderRec();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw null;
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    if (rec !== r) { stream.getTracks().forEach(t => t.stop()); return; }
    startReal(stream);
  } catch (e) {
    if (rec !== r) return;
    r.phase = 'nomic'; r.err = micProblem(e); renderRec();
  }
}
function startReal(stream) {

    const loop = () => {
      if (rec !== r || !r.ac) return;
      an.getByteTimeDomainData(buf);
      let m = 0; for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));
      const o = $('#rec .orb'); if (o) o.style.setProperty('--lvl', r.phase === 'rec' ? (1 + Math.min(m / 100, 1) * .22).toFixed(3) : 1);
      r.raf = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { }
  startRecognition();
  r.clock = setInterval(() => { if (rec === r && r.phase === 'rec') { r.sec++; const t = $('#recTime'); if (t) t.textContent = fmt(r.sec); } }, 1000);
}
function startRecognition() {

/* ================= ОТЛОЖЕННЫЙ РАЗБОР ================= */
// Web Speech умеет слушать только живой микрофон, а не готовый файл.
// Поэтому записи «Ждёт разбора» расшифровывает Whisper прямо в браузере (transformers.js):
// модель скачивается один раз, когда есть интернет, дальше берётся из кэша.
const ASR_LIB = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js';
const ASR_MODEL = 'Xenova/whisper-base';
let asrP = null, pendingBusy = false;
const asrFiles = {};
function loadAsr() {
  if (!asrP) asrP = import(ASR_LIB).then(T => {
    T.env.allowLocalModels = false;
    return T.pipeline('automatic-speech-recognition', ASR_MODEL, {
      progress_callback: p => {
        if (p.status !== 'progress' || !p.total) return;
        asrFiles[p.file] = [p.loaded, p.total];
        const v = Object.values(asrFiles), pct = Math.round(v.reduce((a, x) => a + x[0], 0) / v.reduce((a, x) => a + x[1], 0) * 100);
        setPendingStatus(`Загружаю распознавание… ${pct}%`);
      },
    });
  }).catch(e => { asrP = null; throw e; });
  return asrP;
}
async function to16k(blob) {
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
  const ab = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => { const p = ac.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  try { ac.close(); } catch (e) { }
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new OAC(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000);
  const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start();
  return (await oc.startRendering()).getChannelData(0);
}
function setPendingStatus(text) {
  ui.pendingStatus = text;
  $$('[data-pstatus]').forEach(el => { el.textContent = text || 'Ждёт разбора'; });
}
function applyText(n, text) {
  n.pending = false;
  if (!text) { n.text = 'В этой записи не расслышала слов.'; n.label = 'Голосовая'; return; }
  const a = analyze(text);
  Object.assign(n, { text, title: a.title, cat: a.cat, label: a.label });
  a.tasks.forEach(t => st.tasks.push({ id: uid(), title: t, cat: a.cat, date: todayIso(), done: false, focus: false, noteId: n.id }));
}
function refreshAfterData() {
  if (ui.sheet === 'note') noteSheet(ui.sheetNote);
  if (ui.screen !== 'talk') render(false);
}
async function processPending(manual) {
  const list = st.notes.filter(n => n.pending && n.audio);
  if (!list.length || pendingBusy) return;
  if (!navigator.onLine && !asrP) { if (manual) toast('Нет интернета — разберу, когда сеть появится'); return; }
  pendingBusy = true;
  setPendingStatus('Подключаю распознавание…');
  let done = 0;
  try {
    const asr = await loadAsr();
    for (const n of list) {
      if (!st.notes.includes(n)) continue;
      setPendingStatus('Расшифровываю…');
      const blob = await DB.get('audio', n.id);
      if (!blob) { n.pending = false; n.text = 'Аудио не найдено.'; continue; }
      const out = await asr(await to16k(blob), { language: 'russian', task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });
      applyText(n, (out && out.text || '').trim());
      done++; save();
    }
    if (done) toast(`Разобрала ${done} ${plural(done, ['запись', 'записи', 'записей'])}`);
  } catch (e) {
    console.warn('Lila: отложенный разбор не удался', e);
    if (manual || !ui.asrWarned) toast('Не получилось разобрать запись — попробую позже');

}

  'play-note': el => playNote(el.dataset.id),
  'make-task': el => {
    const n = st.notes.find(x => x.id === el.dataset.id);
    const title = n.type === 'reflection' ? 'Подумать: ' + n.title : n.title;
    st.tasks.push({ id: uid(), title, cat: n.cat, date: todayIso(), done: false, focus: false, noteId: n.id });
    save(); noteSheet(n.id); render(false);
    toast('Задача добавлена в План на сегодня', { label: 'Открыть', fn: () => { closeSheet(); ui.planDay = todayWd(); go('plan'); } });
  },
  'del-ask': el => noteSheet(el.dataset.id, true),
  'del-no': el => noteSheet(el.dataset.id),
  'del-yes': el => {
    const idx = st.notes.findIndex(x => x.id === el.dataset.id); if (idx < 0) return;
    stopVoiceNote();
    const [removed] = st.notes.splice(idx, 1); save(); closeSheet(); render(false);
    // аудио удаляем, только если не нажали «Вернуть»
    const kill = setTimeout(() => { if (removed.audio && !st.notes.includes(removed)) DB.del('audio', removed.id).catch(() => { }); }, 6000);
    toast('Мысль удалена', { label: 'Вернуть', fn: () => { clearTimeout(kill); st.notes.splice(idx, 0, removed); save(); render(false); } });
  },
  'pick-day': el => { ui.planDay = +el.dataset.i; render(false); },
  'toggle-goal': el => { const id = el.dataset.id; ui.openGoals.has(id) ? ui.openGoals.delete(id) : ui.openGoals.add(id); render(false); },
  'toggle-step': el => {
    const g = st.goals.find(x => x.id === el.dataset.goal), s = g.steps.find(x => x.id === el.dataset.id);
    s.done = !s.done; save(); ui.pop = s.id; render(false);
    if (g.steps.every(x => x.done)) toast(`Цель «${g.title}» достигнута!`);
  },
  'idea-to-plan': el => {
    const i = st.ideas.find(x => x.id === el.dataset.id);
    const dayName = d => d.toLocaleDateString('ru-RU', { weekday: 'long' }).replace(/а$/, 'у');
    if (i.added) { const t = findTask(i.task); toast(t ? `Уже в плане на ${dayName(new Date(t.date + 'T00:00:00'))}` : 'Уже в плане'); return; }
    const d = dateOfWd(ui.planDay), tid = uid();
    st.tasks.push({ id: tid, title: 'Рилс: ' + i.title, cat: 'content', date: iso(d), done: false, focus: false, noteId: i.note });
    i.added = true; i.task = tid; save(); render(false);
    toast(`Добавила в план на ${ui.planDay === todayWd() ? 'сегодня' : dayName(d)}`);
  },
  'orb-tap': () => orbTap(),
  'mic': () => toggleMic(),
  'end-call': () => {
    const sec = talk.sec, n = st.chat.filter(m => m.t > Date.now() - (sec + 1) * 1000).length;
    talkLeave(); closeSheet();
    ui.screen = 'today'; render(true);
    toast(`Разговор сохранён · ${fmt(sec)}${n ? ` · ${n} ${plural(n, ['реплика', 'реплики', 'реплик'])}` : ''}`);
  },
  'open-history': () => { openSheet(historyHtml(), 'history'); const s = $('.sheet'); s.scrollTop = s.scrollHeight; },
  'clear-chat': () => { st.chat = []; save(); refreshHistory(); toast('История очищена'); },
  'rec-pause': () => recPause(),
  'rec-stop': () => recStop(),
  'rec-cancel': () => { const wasResult = rec && rec.phase === 'result'; closeRecord(); toast(wasResult ? 'Мысль не сохранена' : 'Запись отменена'); },
  'rec-task': el => { const t = rec.tasks[+el.dataset.i]; t.on = !t.on; stopVoiceNote(); renderRec(); },
  'rec-cat': () => catSheet(),
  'pick-cat': el => { rec.cat = el.dataset.cat; closeSheet(); stopVoiceNote(); renderRec(); toast(`Категория: ${catName(rec.cat)}`); },
  'rec-save': () => recSave(),
  'rec-retry': () => { closeRecord(); setTimeout(openRecord, RM ? 0 : 360); },
  'rec-demo': () => startDemo(),
  'transcribe': () => processPending(true),
  'theme': el => { st.theme = el.dataset.theme; save(); applyTheme(); $('#sheetBody').innerHTML = settingsHtml(); },
  'toggle-voice': () => { st.voice = !st.voice; save(); if (!st.voice) hush(); $('#sheetBody').innerHTML = settingsHtml(); },
  'reset-ask': () => { $('#sheetBody').innerHTML = settingsHtml(true); const s = $('.sheet'); s.scrollTo({ top: s.scrollHeight, behavior: 'smooth' }); },
  'reset-no': () => { $('#sheetBody').innerHTML = settingsHtml(); },
  'reset-yes': () => {
    stopBrief(); stopVoiceNote(); talkLeave();
    const theme = st.theme;
    try { localStorage.removeItem(KEY); } catch (e) { }
    DB.clear('audio').catch(() => { });
    st = seed(); st.theme = theme; save();
    Object.assign(ui, { screen: 'today', filter: 'all', q: '', planDay: todayWd(), fresh: null, goalPrev: {} }); ui.openGoals.clear();
    closeSheet(); render(true); toast('Демо-данные восстановлены');
  },
  'toast-action': () => { $('#toast').classList.remove('show'); if (toastFn) { const f = toastFn; toastFn = null; f(); } },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !A[el.dataset.act]) return;
  e.preventDefault();
  A[el.dataset.act](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.sheet) closeSheet(); else if (rec) { closeRecord(); toast('Запись отменена'); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('article[data-act]')) { e.preventDefault(); A[e.target.dataset.act](e.target); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { ui.q = e.target.value; $('#clearSearch').style.visibility = ui.q ? 'visible' : 'hidden'; refreshThoughtList(); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'writeForm') return;
  e.preventDefault();
  const inp = $('#writeInput'), text = inp.value.trim();
  if (!text) { inp.focus(); toast('Напиши пару слов'); return; }
  inp.value = '';
  if (talk.muted) toggleMic();
  talkClear();
  userSaid(text, true);
  setTalk('thinking');
  $('#talkReply').innerHTML = '<span style="color:var(--ink3)">…</span>';
  talk.timers.push(setTimeout(() => aiSay(replyFor(text)), 1000));
});

/* ================= РАМКА ТЕЛЕФОНА ================= */
function fit() {
  const d = $('#device');
  if (innerWidth >= 600 && innerHeight >= 560) {
    const s = Math.min(1, (innerHeight - 48) / 868, (innerWidth - 48) / 414);
    d.style.transform = s < 1 ? `scale(${s})` : '';
  } else d.style.transform = '';
}
function clock() { const n = new Date(); $('#sbTime').textContent = `${n.getHours()}:${pad(n.getMinutes())}`; }
addEventListener('resize', fit);

/* ================= СТАРТ ================= */
addEventListener('online', () => processPending());
addEventListener('offline', () => toast('Нет сети — всё работает, записи разберу позже'));
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { ui.swReady = true; }).catch(() => { });
}
(async () => {
  await load();
  applyTheme();
  fit(); clock(); setInterval(clock, 20000);
  render(true);
  processPending();
})();
</script>
</body>
</html>
